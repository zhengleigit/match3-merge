# Builds the game and publishes it to GitHub Pages.
#
# Why this exists instead of committing dist/: the project's .gitignore keeps
# dist/ out of the repo, so Pages cannot serve a folder that is never pushed.
# Building here also removes the most common source of "the tester still sees
# the old build" — there is no manual copy step to forget.
#
# One-time setup in the repository: Settings -> Pages -> Source = "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deployment from the Actions tab without pushing.
  workflow_dispatch:

# Least privilege: only what Pages deployment actually needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. A queued run waits rather than being dropped,
# so a push landing during a deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` needs package-lock.json, which is committed.
      - name: Install dependencies
        run: npm ci

      # Test failures should block a deployment: shipping a broken build to
      # testers is worse than a red check.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Vite's base is './' and every asset path is relative, so the site
          # works from a subpath such as /<repo>/ without extra configuration.
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
